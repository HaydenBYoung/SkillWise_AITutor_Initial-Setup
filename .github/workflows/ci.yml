name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: skillwise_db
          POSTGRES_USER: skillwise_user
          POSTGRES_PASSWORD: skillwise_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwise_user -d skillwise_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U skillwise_user && break || sleep 2;
          done

      - name: Run backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_db
        run: npm run migrate

      - name: Seed Cypress test user
        working-directory: backend
        env:
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_db
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.CYPRESS_TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.CYPRESS_TEST_USER_PASSWORD }}
          CYPRESS_TEST_USER_FIRSTNAME: ${{ secrets.CYPRESS_TEST_USER_FIRSTNAME }}
          CYPRESS_TEST_USER_LASTNAME: ${{ secrets.CYPRESS_TEST_USER_LASTNAME }}
        run: npm run seed:cypress

      - name: Run backend tests (Jest)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_db
        run: npm test -- --runInBand --detectOpenHandles

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Cypress (headless)
        uses: cypress-io/github-action@v5
        with:
          start: npx serve -s build -l 3000
          wait-on: http://localhost:3000
          wait-on-timeout: 60
          browser: chrome
          record: false
        env:
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.CYPRESS_TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.CYPRESS_TEST_USER_PASSWORD }}
          REACT_APP_API_URL: http://localhost:3001/api
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_db

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots
            frontend/cypress/results
